version: '3.8'

services:
  db-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: db_sync_proxy
    environment:
      # IMPORTANT: When running in --web-ui mode, database configuration
      # comes from the SQLite database (configured via Web UI).
      # DO NOT set SOURCE_DB_* or TARGET_DB_* environment variables here
      # as they will override the Web UI configuration!
      
      # Only set logging level
      RUST_LOG: info
      
      # NOTE: If you want to run CLI mode (not web-ui), uncomment these:
      # SOURCE_DB_TYPE: mysql
      # TARGET_DB_TYPE: mysql
      # SOURCE_DB_HOST: host.docker.internal
      # SOURCE_DB_PORT: 3306
      # SOURCE_DB_DATABASE: testing
      # SOURCE_DB_USERNAME: root
      # SOURCE_DB_PASSWORD: password
      # TARGET_DB_HOST: host.docker.internal
      # TARGET_DB_PORT: 3306
      # TARGET_DB_DATABASE: testing2
      # TARGET_DB_USERNAME: root
      # TARGET_DB_PASSWORD: password
      # SYNC_MODE: initial
      # BATCH_SIZE: 1000
    command: ["--web-ui"]  # Web UI mode - config from SQLite database
    restart: unless-stopped
    ports:
      - "5009:5009"
    volumes:
      - ./db_sync_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Enable access to host machine
